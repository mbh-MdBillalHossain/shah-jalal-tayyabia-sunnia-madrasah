  <div id="mainCarousel" class="carousel slide" data-bs-ride="carousel">
    <!-- Slide Indicators (8 Total) -->
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="0" class="active" aria-current="true"
        aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
      <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="3" aria-label="Slide 4"></button>
      <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="4" aria-label="Slide 5"></button>
      <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="5" aria-label="Slide 6"></button>
      <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="6" aria-label="Slide 7"></button>
      <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="7" aria-label="Slide 8"></button>
    </div>

    <!-- Slides Container -->
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="assets/mainPhoto.jpeg" class="d-block w-100" alt="Main photo">
      </div>
      <div class="carousel-item">
        <img src="assets/oldphoto1.jpeg" class="d-block w-100" alt="Old photo 1">
      </div>
      <div class="carousel-item">
        <img src="assets/madrasha1.PNG" class="d-block w-100" alt="Madrasha photo 1">
      </div>
      <div class="carousel-item">
        <img src="assets/madrasha2.jpg" class="d-block w-100" alt="Madrasha photo 2">
      </div>
      <div class="carousel-item">
        <img src="assets/madrasha3.jpg" class="d-block w-100" alt="Madrasha photo 3">
      </div>
      <div class="carousel-item">
        <img src="assets/madrasha4.jpg" class="d-block w-100" alt="Madrasha photo 4">
      </div>
      <div class="carousel-item">
        <img src="assets/madrasha5.jpg" class="d-block w-100" alt="Madrasha photo 5">
      </div>
      <div class="carousel-item">
        <img src="assets/oldphoto2.jpeg" class="d-block w-100" alt="Old photo 2">
      </div>
    </div> <!-- Properly closes .carousel-inner here -->

    <!-- Navigation Arrows -->
    <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
