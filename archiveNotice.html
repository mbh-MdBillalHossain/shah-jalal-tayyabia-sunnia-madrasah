<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আর্কাইভ নোটিশ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans Bengali', sans-serif; background: #f8f9fa; }
    .page-title { border-bottom: 3px solid #146c43; display: inline-block; padding-bottom: 6px; }
    .year-heading {
      background: #146c43;
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      margin-top: 30px;
      margin-bottom: 12px;
    }
    .notice-date { font-size: 0.85rem; color: #6c757d; }
    .accordion-button:not(.collapsed) { background-color: #e8f4ec; color: #146c43; }
  </style>
</head>
<body>

<div class="container py-4">
  <h2 class="page-title mb-4">আর্কাইভ নোটিশ</h2>

  <!-- ফিল্টার (ঐচ্ছিক ডেমো) -->
  <div class="row mb-3">
    <div class="col-md-4">
      <select class="form-select">
        <option selected>সকল বছর</option>
        <option>২০২৬</option>
        <option>২০২৫</option>
      </select>
    </div>
  </div>

  <div class="accordion" id="archiveAccordion">

    <!-- ২০২৬ -->
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#year2026">
          ২০২৬ সালের নোটিশসমূহ
        </button>
      </h2>
      <div id="year2026" class="accordion-collapse collapse show" data-bs-parent="#archiveAccordion">
        <div class="accordion-body">
          <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex justify-content-between align-items-center">
              <a href="#notice-details/notice0.html" class="text-decoration-none">প্রথম সাময়িক পরীক্ষার ফলাফল প্রকাশ</a>
              <span class="notice-date">১০ জুন, ২০২৬</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
              <a href="#notice-details/notice00.html" class="text-decoration-none">বসন্তকালীন ছুটির নোটিশ</a>
              <span class="notice-date">২০ মার্চ, ২০২৬</span>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <!-- ২০২৫ -->
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#year2025">
          ২০২৫ সালের নোটিশসমূহ
        </button>
      </h2>
      <div id="year2025" class="accordion-collapse collapse" data-bs-parent="#archiveAccordion">
        <div class="accordion-body">
          <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex justify-content-between align-items-center">
              <a href="#notice-details/notice000.html" class="text-decoration-none">বার্ষিক পরীক্ষার সময়সূচি</a>
              <span class="notice-date">১৫ ডিসেম্বর, ২০২৫</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
              <a href="#notice-details/notice0000.html" class="text-decoration-none">নতুন শিক্ষাবর্ষের ভর্তি বিজ্ঞপ্তি</a>
              <span class="notice-date">০৫ জানুয়ারি, ২০২৫</span>
            </li>
          </ul>
        </div>
      </div>
    </div>

  </div>

  <div class="mt-4">
    <a href="recentNotice.html" class="btn btn-outline-success">
      &laquo; সাম্প্রতিক নোটিশে ফিরে যান
    </a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
